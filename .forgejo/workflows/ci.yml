name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: docker
    container: rust:1.100.0-bookworm
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run all-target tests
        run: cargo test --all-targets --all-features
      - name: Run documentation tests
        run: cargo test --doc
